name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # 開発機は macOS だけなので、Windows / Linux の問題(パス・改行・文字コード)は CI で拾う。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx electron-vite build
