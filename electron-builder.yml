appId: jp.snapcase.app
productName: Snapcase
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!docs/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
  # get-windows は OS ごとのネイティブ実行ファイルを子プロセスで起動するため、asar の外に置く。
  - node_modules/get-windows/**
win:
  executableName: snapcase
  target:
    - nsis
    - portable
nsis:
  artifactName: ${name}-${version}-win-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
portable:
  artifactName: ${name}-${version}-win-portable.${ext}
mac:
  category: public.app-category.developer-tools
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSScreenCaptureUsageDescription: テスト対象のウィンドウを撮影して証跡にするために使います。
    NSDocumentsFolderUsageDescription: 証跡の保存先として書類フォルダを使います。
  notarize: false
  target:
    - dmg
dmg:
  # Intel と Apple Silicon を同じ名前にしない。
  artifactName: ${name}-${version}-mac-${arch}.${ext}
linux:
  target:
    - AppImage
  category: Utility
appImage:
  artifactName: ${name}-${version}-linux-${arch}.${ext}
npmRebuild: false
